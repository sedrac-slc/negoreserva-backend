services:
  negoreserva:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: negoreserva-api-dev
    env_file:
      - .env.dev
    ports:
      - "8081:8080"
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: always
    networks:
      - negoreserva-net

  postgres-dev:
    image: pgvector/pgvector:pg16
    container_name: postgres-dev
    env_file:
      - .env.dev
    expose:
      - "5432"
    labels:
      org.springframework.boot.service-connection: postgres
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - negoreserva-net

networks:
  negoreserva-net:
    driver: bridge

volumes:
  postgres-dev-data: